name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the Python bundled with QGIS 3.22/3.28 LTR (qgisMinimumVersion=3.22);
        # modules using PEP 604 (`X | None`) annotations need `from __future__ import annotations`.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # actions/setup-python has no Python 3.9 build for newer Ubuntu images.
          - python-version: "3.9"
            runner: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The numerical core depends only on NumPy; QGIS is NOT required to test it.
          pip install numpy pytest

      - name: Run test suite
        run: pytest -v

  lint:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Configuration (max-line-length, excludes, per-file-ignores) lives in setup.cfg.
      - name: Run flake8
        run: flake8 __init__.py core qgis_integration

  security:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      # plugins.qgis.org blocks uploads with any Bandit finding, including low severity.
      - name: Run bandit
        run: bandit -r __init__.py core qgis_integration
