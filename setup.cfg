[flake8]
# Line length is enforced at 120 (pycodestyle's 79 is impractical for the
# math-heavy numerical core). E203/W503 conflict with Black-style formatting.
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    docs,
    paper,
    build,
    dist,
    site,
    _site_test
per-file-ignores =
    # The HTML report is a template module; its markup lines are intentionally long.
    core/reports/html_report.py: E501
